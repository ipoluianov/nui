name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Build the other platforms
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done
      - name: Test
        run: go test ./...
      - name: Golden image differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: |
            **/testdata/golden/**/*.actual.png
            **/testdata/golden/**/*.diff.png
          if-no-files-found: ignore
